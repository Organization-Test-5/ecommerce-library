<button
  class="eco-button eco-button--{{ variant }} eco-button--{{ size }}"
  [type]="type"
  [disabled]="isDisabled"
  [attr.aria-label]="ariaLabel || label"
  (click)="onClick()"
>
  <span *ngIf="loading" class="eco-button__spinner" aria-hidden="true">
    <span class="eco-button__spinner-icon"></span>
  </span>
  <span class="eco-button__label">{{ label }}</span>
</button>
